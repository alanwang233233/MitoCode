name: Mention
on:
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]

permissions:
  issues: write
  pull-requests: write
  actions: write

jobs:
  handle_mention:
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.comment.body, '@mitocode-bot[bot]') &&
      github.event.comment.user.type != 'Bot'
    steps:
      - name: Get GitHub App Token
        id: get_app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Reply comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.get_app_token.outputs.token }}
          script: |
            const login = context.payload.comment.user.login;
            const body = context.payload.comment.body;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 @" + login + "，已收到你的指令：" + body
            })

      - name: Trigger CI
        if: >-
          contains(github.event.comment.body, 'run-ci') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.get_app_token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const login = context.payload.comment.user.login;

            const isPr = Boolean(
              context.payload.issue?.pull_request || context.payload.pull_request
            );
            if (!isPr) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: context.issue.number,
                body: `⚠️ @${login} \`run-ci\` 仅支持在 Pull Request 中触发。`
              });
              return;
            }

            let prNumber;
            let headRef;
            if (context.payload.issue?.pull_request) {
              prNumber = context.payload.issue.number;
              const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              headRef = pr.data.head.ref;
            } else {
              prNumber = context.payload.pull_request.number;
              headRef = context.payload.pull_request.head.ref;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'ci.yml',
              ref: 'main',
              inputs: {
                pr_number: String(prNumber),
                head_ref: headRef
              }
            });
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: context.issue.number,
              body: `✅ @${login} 已触发 CI。`
            })
