name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string
        description: "PR number to report results to (set when triggered via run-ci)"
      head_ref:
        required: false
        type: string
        description: "Branch to check out (set when triggered via run-ci)"

jobs:
  ci:
    name: Test and Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref || github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install black pylint pyright pytest-cov

      # ===== 1. pytest + coverage =====
      - name: Run pytest with coverage
        id: pytest
        run: |
          set -o pipefail
          stdbuf -i0 -o0 -e0 python -m pytest test/ \
            --cov=src/mitocode \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=80 \
            --junitxml=report.xml 2>&1 | tee pytest-cov-output.txt

      # ===== 2. gitleaks =====
      - name: Run gitleaks scan
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ""

      # ===== 3. black =====
      - name: Run black formatter
        id: black
        run: |
          black src test --target-version=py310

      # ===== 6. pylint =====
      - name: Run pylint
        id: pylint
        run: |
          pylint --output-format=json2 src/mitocode > pylint-report.json || true
          python - <<'PY'
          import json, sys
          try:
              data = json.load(open('pylint-report.json'))
          except (json.JSONDecodeError, FileNotFoundError):
              print('pylint: no data')
              sys.exit(0)
          stats = data.get('statistics', {})
          score = float(stats.get('score', 0))
          print(f'pylint score: {score:.2f}/10')
          if score < 8:
              print('pylint score is below 8, failing')
              sys.exit(1)
          PY

      # ===== 7. pyright =====
      - name: Run pyright
        id: pyright
        run: |
          pyright src | tee pyright-output.txt

      # ===== 提交代码变更 =====
      - name: Commit and push changes
        id: commit
        if: |
          (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')) &&
          steps.pytest.outcome == 'success' &&
          steps.pylint.outcome == 'success' &&
          steps.pyright.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "ci: auto-format code"
            git push origin HEAD:${{ inputs.head_ref || github.head_ref }}
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # ===== 生成 CI 汇总 =====
      - name: Generate CI summary
        id: summary
        if: always()
        env:
          CI_COMMIT_STATUS: |
            ${{ steps.commit.outcome == 'success' && (steps.commit.outputs.committed == 'true' && '已自动提交 ✅' || '无变更可提交') || (steps.commit.outcome == 'skipped' && '未执行（前置阻塞步骤未通过）' || '待执行') }}
        run: |
          python chore/ci_summary.py --repo-root .

      # ===== 发布 PR 评论 =====
      - name: Publish PR comment
        if: >-
          always() &&
          (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != ''))
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ci-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER || context.issue.number),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
        env:
          PR_NUMBER: ${{ inputs.pr_number }}

      # ===== 上传 CI 产物 =====
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            report.xml
            coverage.xml
            pylint-report.json
            pyright-output.txt
            ci-summary.md
            ci-summary.json