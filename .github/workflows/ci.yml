name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ci:
    name: Test and Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      security-events: write
    steps:
      # ===== 清理旧的 CI 产物 =====
      - name: Clean up previous CI artifacts
        run: |
          rm -f report.xml coverage.xml gitleak-result.json licenses.csv \
                pylint-report.json pyright-output.txt eff-u-code-output.txt \
                pip-audit-output.txt license-check-output.txt \
                ci-summary.md ci-summary.json

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install CI tools
        run: |
          python -m pip install black pylint pyright pip-audit pip-licenses pytest-cov
          npm install -g eff-u-code

      # ===== 1. pytest + coverage =====
      - name: Run pytest with coverage
        id: pytest
        run: |
          set -o pipefail
          stdbuf -i0 -o0 -e0 python -m pytest test/ \
            --cov=src/mitocode \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=80 \
            --junitxml=report.xml 2>&1 | tee pytest-cov-output.txt

      # ===== 2. gitleaks =====
      - name: Run gitleaks scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ""

      - name: Export gitleaks report
        if: always() && steps.gitleaks.outcome == 'success'
        run: |
          gitleaks detect --source . --no-git -f json -r gitleak-result.json 2>/dev/null || echo '[]' > gitleak-result.json

      # ===== 3. pip-audit =====
      - name: Run pip-audit
        id: pip-audit
        continue-on-error: true
        run: |
          pip-audit | tee pip-audit-output.txt

      # ===== 4. pip-licenses =====
      - name: Run pip-licenses and license check
        id: pip-licenses
        continue-on-error: true
        run: |
          pip-licenses --format=csv --output-file=licenses.csv
          python chore/check_licence.py | tee license-check-output.txt || true

      # ===== 5. black =====
      - name: Run black formatter
        id: black
        run: |
          black src test --target-version=py310

      # ===== 6. pylint =====
      - name: Run pylint
        id: pylint
        run: |
          pylint --output-format=json2 src/mitocode > pylint-report.json || true
          python - <<'PY'
          import json, sys
          data = json.load(open('pylint-report.json'))
          stats = data.get('statistics', {})
          score = float(stats.get('score', 0))
          print(f'pylint score: {score:.2f}/10')
           if score < 9:
              print('pylint score is below 8, failing')
              sys.exit(1)
          PY

      # ===== 7. pyright =====
      - name: Run pyright
        id: pyright
        run: |
          pyright src

      # ===== 8. eff-u-code =====
      - name: Run eff-u-code
        id: eff-u-code
        continue-on-error: true
        run: |
          fuck-u-code analyze src | tee eff-u-code-output.txt

      # ===== 9. CodeQL =====
      - name: Initialize CodeQL
        id: codeql-init
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        id: codeql
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: sarif-results

      # ===== 10. 提交代码变更 =====
      - name: Commit and push changes
        id: commit
        if: |
          github.event_name == 'pull_request' &&
          steps.pytest.outcome == 'success' &&
          steps.gitleaks.outcome == 'success' &&
          steps.pylint.outcome == 'success' &&
          steps.pyright.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "ci: auto-format code"
            git push origin HEAD:${{ github.head_ref }}
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # ===== 生成 CI 汇总 =====
      - name: Generate CI summary
        id: summary
        if: always()
        env:
          CI_COMMIT_STATUS: |
            ${{ steps.commit.outcome == 'success' && (steps.commit.outputs.committed == 'true' && '已自动提交 ✅' || '无变更可提交') || (steps.commit.outcome == 'skipped' && '未执行（前置阻塞步骤未通过）' || '待执行') }}
        run: |
          python chore/ci_summary.py --repo-root .

      # ===== 发布 PR 评论 =====
      - name: Publish PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ci-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      # ===== 上传 CI 产物 =====
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            report.xml
            coverage.xml
            gitleak-result.json
            licenses.csv
            pylint-report.json
            pip-audit-output.txt
            pyright-output.txt
            eff-u-code-output.txt
            license-check-output.txt
            ci-summary.md
            ci-summary.json

      - name: Upload CodeQL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: |
            sarif-results/

      # ===== 清理 CI 产物 =====
      - name: Clean up CI artifacts
        if: always()
        run: |
          rm -f report.xml coverage.xml gitleak-result.json licenses.csv \
                pylint-report.json pyright-output.txt eff-u-code-output.txt \
                pip-audit-output.txt license-check-output.txt \
                ci-summary.md ci-summary.json