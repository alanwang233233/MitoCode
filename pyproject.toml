[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitocode"
version = "0.1.0"
description = "vibe_coding_test"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uvicorn",
    "sse-starlette",
    "rich",
    "openai",
    "mcp",
    "loguru",
    "httpx",
    "httpx-sse",
    "textual",
    "fastapi",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "openai",
    "mcp",
    "loguru",
    "httpx",
    "httpx-sse",
    "textual",
    "fastapi",
]

[tool.coverage.run]
source = ["src/mitocode"]
omit = [
    "src/mitocode/tui/*",
    "src/mitocode/__main__.py",
    "src/mitocode/backend/chat_provider/scenario_provider.py",
]

[tool.pyright]
typeCheckingMode = "standard"
reportAttributeAccessIssue = true
reportMissingImports = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalContextManager = true
reportGeneralTypeIssues = true
reportArgumentType = true
